<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Verdict Retrieval - Test UI</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 8px; }
  input, select { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  #q { flex: 1; }
  button { padding: 10px 18px; background: #1a1a2e; color: white; border: none; border-radius: 6px; cursor: pointer; }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; }
  .result { border: 1px solid #e2e2e2; border-radius: 8px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .result:hover { background: #f7f7fb; }
  .result h3 { margin: 0 0 6px 0; font-size: 15px; }
  .meta { font-size: 13px; color: #555; }
  .badge { display: inline-block; font-size: 11px; background: #eee; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  #detail { white-space: pre-wrap; border: 1px solid #e2e2e2; border-radius: 8px; padding: 16px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
  #count { font-size: 13px; color: #777; margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>⚖️ Verdict Retrieval</h1>
  <div class="search-bar">
    <input id="q" placeholder="Search by case name, keyword, citation..." />
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="filters">
    <select id="court"><option value="">All courts</option></select>
    <input id="yearFrom" type="number" placeholder="Year from" style="width:100px" />
    <input id="yearTo" type="number" placeholder="Year to" style="width:100px" />
  </div>
  <div id="count"></div>
  <div id="results"></div>
  <div id="detail"></div>

<script>
const API = "http://localhost:5000/api";

async function loadCourts() {
  const res = await fetch(`${API}/courts`);
  const courts = await res.json();
  const sel = document.getElementById("court");
  courts.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

async function doSearch() {
  const q = document.getElementById("q").value;
  const court = document.getElementById("court").value;
  const yearFrom = document.getElementById("yearFrom").value;
  const yearTo = document.getElementById("yearTo").value;

  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (court) params.set("court", court);
  if (yearFrom) params.set("year_from", yearFrom);
  if (yearTo) params.set("year_to", yearTo);

  const res = await fetch(`${API}/search?${params}`);
  const data = await res.json();

  document.getElementById("count").textContent = `${data.total} result(s)`;
  const container = document.getElementById("results");
  container.innerHTML = "";
  document.getElementById("detail").textContent = "";

  data.results.forEach(r => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <h3>${r.title || "(untitled)"} ${r.is_partial ? '<span class="badge">incomplete metadata</span>' : ''}</h3>
      <div class="meta">${r.court || "Unknown court"} · ${r.date_of_judgment || "date unknown"} · ${r.citations || ""}</div>
    `;
    div.onclick = () => loadDetail(r.id);
    container.appendChild(div);
  });
}

async function loadDetail(id) {
  const res = await fetch(`${API}/verdict/${id}`);
  const d = await res.json();
  document.getElementById("detail").textContent = d.full_text.slice(0, 4000) + "\n\n... (truncated preview — full text available via API)";
}

loadCourts();
</script>
</body>
</html>
